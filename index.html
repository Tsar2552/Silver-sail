<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ใบเรือเงิน: คลังใต้ภูผา</title><link rel="stylesheet" href="css/style.css"></head>
<body><div class="menu" id="menu">
<h1>ใบเรือเงิน</h1><p>คลังใต้ภูผา · เกมผลัดตา แฟนตาซี</p>
<button class="big-btn" id="bStart">⚔ เริ่มเกม</button>
<div class="sub" id="subStart">
  <button class="big-btn" id="bSolo">เล่นคนเดียว</button>
  <button class="big-btn" id="bMulti">เล่นหลายคน (ห้อง 4 หลัก)</button>
</div>
<button class="big-btn" id="bLoad">📂 โหลดเซฟ (เล่นคนเดียว)</button>
<div class="card" id="loadBox" style="display:none;text-align:left"></div>
<a href="vault.html"><button class="big-btn">🧍 ตัวละครของฉัน</button></a>
<a href="wiki.html"><button class="big-btn">📖 สารานุกรม</button></a>
<p class="dim" style="margin-top:30px">เซฟเก็บในเบราว์เซอร์นี้ · สำรองเป็นไฟล์ได้ในหน้าโหลดเซฟ</p>
</div>
<script src="js/common.js"></script><script src="js/vault.js"></script>
<script>
$("#bStart").onclick=()=>$("#subStart").classList.toggle("on");
$("#bSolo").onclick=()=>{const cs=Vault.all().filter(c=>!c.lock);
  if(!cs.length){alert("ยังไม่มีตัวละครว่างในคลัง\nไปสร้างและกด 'เก็บตัวละครเข้าคลัง' ก่อน");location.href="vault.html";return;}
  const i=prompt("เลือกตัวละคร (พิมพ์เลข)\n"+cs.map((c,n)=>`${n+1}. ${c.name} Lv${c.level}`).join("\n"),"1");if(i===null)return;
  const c=cs[(+i||1)-1];if(!c)return;const t=prompt("ตั้งชื่อเซฟ","การผจญภัยของ "+c.name);if(t===null)return;
  const k=Campaign.create(t.trim()||"การผจญภัยของฉัน","ฉัน","solo");Campaign.addMember(k,"ฉัน",Vault.checkout(c.cid,"solo:"+k.id));location.href="story.html?camp="+k.id;};
$("#bMulti").onclick=()=>location.href="story.html?mp=1";
$("#bLoad").onclick=()=>{const b=$("#loadBox");b.style.display=b.style.display==="none"?"block":"none";renderLoad();};
function renderLoad(){
  const l=Campaign.all().filter(k=>k.kind==="solo");
  $("#loadBox").innerHTML=`<h3>เซฟเล่นคนเดียว</h3>${l.length?l.map(k=>`<div class="row" style="align-items:center;margin-bottom:6px"><div style="flex:1"><b>${esc(k.title)}</b><div class="dim">Act ${k.act} · ${esc(k.party.map(m=>m.char.name).join(", "))} · ${new Date(k.updated).toLocaleString("th-TH")}</div></div>
  <button class="ok" data-a="go" data-i="${k.id}">เล่นต่อ</button><button data-a="fin" data-i="${k.id}">จบ Act</button><button data-a="del" data-i="${k.id}">ลบ</button></div>`).join(""):'<div class="dim">ยังไม่มีเซฟ</div>'}`;
  $$("#loadBox button").forEach(b=>b.onclick=()=>{const id=b.dataset.i,a=b.dataset.a,k=Campaign.get(id);
    if(a==="go")location.href="story.html?camp="+id;
    if(a==="fin"&&confirm("จบ Act "+k.act+": อัปเดตตัวละครเข้าคลัง แล้วไป Act ถัดไป?")){const out=Campaign.finishAct(k);
      k.party=out.map(o=>{Vault.checkin(o.char,"จบ Act "+(k.act-1));return{owner:o.owner,char:Vault.checkout(o.char.cid,"solo:"+k.id)};});
      Campaign.put(k);alert("อัปเดตตัวละครเข้าคลังแล้ว · ตอนนี้ Act "+k.act);renderLoad();}
    if(a==="del"&&confirm("ลบเซฟนี้? (ตัวละครในคลังจะถูกปลดล็อก)")){Campaign.remove(id);renderLoad();}
  });
}
</script></body></html>

<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ใบเรือเงิน: คลังใต้ภูผา</title><link rel="stylesheet" href="css/style.css"></head>
<body><div class="menu" id="menu">
<h1>ใบเรือเงิน</h1><p>คลังใต้ภูผา · เกมผลัดตา แฟนตาซี</p>
<button class="big-btn" id="bStart">⚔ เริ่มเกม</button>
<div class="sub" id="subStart">
  <button class="big-btn" id="bSolo">เล่นคนเดียว</button>
  <button class="big-btn" id="bMulti">เล่นหลายคน (ห้อง 4 หลัก)</button>
</div>
<button class="big-btn" id="bLoad">📂 โหลดเซฟ (เล่นคนเดียว)</button>
<div class="card" id="loadBox" style="display:none;text-align:left"></div>
<a href="wiki.html"><button class="big-btn">📖 สารานุกรม</button></a>
<p class="dim" style="margin-top:30px">เซฟเก็บในเบราว์เซอร์นี้ · สำรองเป็นไฟล์ได้ในหน้าโหลดเซฟ</p>
</div>
<script src="js/common.js"></script>
<script>
$("#bStart").onclick=()=>$("#subStart").classList.toggle("on");
$("#bSolo").onclick=()=>{const n=prompt("ตั้งชื่อเซฟใหม่","การผจญภัยของฉัน");if(n===null)return;const s=Saves.create(n.trim()||"การผจญภัยของฉัน","solo");location.href="play.html?save="+s.id;};
$("#bMulti").onclick=()=>location.href="lobby.html";
$("#bLoad").onclick=()=>{const b=$("#loadBox");b.style.display=b.style.display==="none"?"block":"none";renderLoad();};
function renderLoad(){
  const l=Saves.all().filter(s=>s.mode==="solo");
  $("#loadBox").innerHTML=`<h3>เซฟที่มี</h3>${l.length?l.map(s=>`<div class="row" style="align-items:center;margin-bottom:6px"><div style="flex:1"><b>${esc(s.name)}</b><div class="dim">${new Date(s.updated).toLocaleString("th-TH")}</div></div>
  <button class="ok" data-a="go" data-i="${s.id}">เล่นต่อ</button><button data-a="ex" data-i="${s.id}">ส่งออก</button><button data-a="del" data-i="${s.id}">ลบ</button></div>`).join(""):'<div class="dim">ยังไม่มีเซฟ</div>'}
  <hr style="border-color:var(--line)"><label class="dim">นำเข้าไฟล์เซฟ: <input type="file" id="imp" accept=".json"></label>`;
  $$("#loadBox button").forEach(b=>b.onclick=()=>{const id=b.dataset.i,a=b.dataset.a;
    if(a==="go")location.href="play.html?save="+id;
    if(a==="ex")Saves.exportFile(Saves.get(id));
    if(a==="del"&&confirm("ลบเซฟนี้?")){Saves.remove(id);renderLoad();}});
  $("#imp").onchange=e=>e.target.files[0]&&Saves.importFile(e.target.files[0]).then(renderLoad).catch(x=>alert(x.message));
}
</script></body></html>
